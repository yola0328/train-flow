<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列車處理流程</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
</head>
<body>
<div id="app" style="max-width: 800px; margin: auto; font-family: sans-serif;">
    <div style="background: #eef; padding: 20px; text-align: center; border-radius: 10px;">
        <h3 id="step-desc">請點擊下方開始流程</h3>
        <div id="btn-group">
            <button onclick="nextStep('STEP1')" style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;">開始處置</button>
        </div>
        <button onclick="location.reload()" style="margin-top: 10px; font-size: 12px;">重新開始</button>
    </div>
    <div id="graph-container" style="margin-top: 20px; border: 1px solid #ccc;">
        <div class="mermaid" id="mermaid-svg">
            graph TD
                A[氣壓式懸吊系統故障] --> B[Traffic Zone 50% 速限]
                B --> C[下達 Train Hold]
                C --> D{壓力是否低於標準?}
                D -- 是 --> E[到站清車 / 重置 CB7]
                E --> F((結束))
                D -- 否 --> G[檢視地板高低差]
                G --> H{低於月台 > 2.5cm?}
                H -- 否 --> I[繼續營運 / 端點移除]
                I --> K((結束))
                H -- 是 --> J[隨車提醒 / 端點移除]
                J --> L((結束))
        </div>
    </div>
</div>

<script>
    // 強制初始化
    mermaid.initialize({ startOnLoad: true, theme: 'neutral' });

    let activeEdges = [];
    let activeNodes = ['A'];

    const flow = {
        'STEP1': { text: "確認：已執行 50% 速限？", btns: [{ label: "確認", next: 'STEP2', edge: 0, node: 'B' }] },
        'STEP2': { text: "確認：已下達 Train Hold？", btns: [{ label: "確認", next: 'STEP3', edge: 1, node: 'C' }] },
        'STEP3': { text: "判斷：壓力是否低於標準？", btns: [{ label: "是", next: 'FIN1', edge: 3, node: 'D' }, { label: "否", next: 'STEP4', edge: 5, node: 'D' }], entry: 2 },
        'FIN1': { text: "處置：重置 CB7", btns: [{ label: "完成", next: 'DONE', edge: 4, node: 'E' }] },
        'STEP4': { text: "確認：已檢視高低差？", btns: [{ label: "確認", next: 'STEP5', edge: 6, node: 'G' }] },
        'STEP5': { text: "判斷：落差是否 > 2.5cm？", btns: [{ label: "是", next: 'FIN2', edge: 8, node: 'H' }, { label: "否", next: 'FIN3', edge: 7, node: 'H' }] },
        'FIN2': { text: "處置：派員隨車提醒", btns: [{ label: "完成", next: 'DONE', edge: 10, node: 'J' }] },
        'FIN3': { text: "處置：繼續營運", btns: [{ label: "完成", next: 'DONE', edge: 9, node: 'I' }] }
    };

    function nextStep(key) {
        const d = flow[key];
        if (!d) return;
        if(d.entry !== undefined) activeEdges.push(d.entry);
        document.getElementById('step-desc').innerText = d.text;
        const bg = document.getElementById('btn-group');
        bg.innerHTML = '';
        d.btns.forEach(b => {
            const btn = document.createElement('button');
            btn.innerText = b.label;
            btn.style.cssText = "padding: 10px 20px; margin: 5px; cursor: pointer;";
            btn.onclick = () => {
                if (b.edge !== undefined) activeEdges.push(b.edge);
                if (b.node) activeNodes.push(b.node);
                if (b.next === 'DONE') {
                    document.getElementById('step-desc').innerText = "處置完成";
                    bg.innerHTML = "";
                } else { nextStep(b.next); }
            };
            bg.appendChild(btn);
        });
        draw();
    }

    function draw() {
        let code = `graph TD\nA[氣壓式懸吊系統故障]\nB[Traffic Zone 50% 速限]\nC[下達 Train Hold]\nD{壓力是否低於標準?}\nE[到站清車 / 重置 CB7]\nF((結束))\nG[檢視地板高低差]\nH{低於月台 > 2.5cm?}\nI[繼續營運 / 端點移除]\nJ[隨車提醒 / 端點移除]\nK((結束))\nL((結束))\nA --> B\nB --> C\nC --> D\nD -- 是 --> E\nE --> F\nD -- 否 --> G\nG --> H\nH -- 否 --> I\nH -- 是 --> J\nI --> K\nJ --> L\nclassDef act fill:#fff3cd,stroke:#ffc107,stroke-width:4px;`;
        activeEdges.forEach(i => code += `\nlinkStyle ${i} stroke:#dc3545,stroke-width:5px;`);
        activeNodes.forEach(n => code += `\nclass ${n} act;`);
        const container = document.getElementById('graph-container');
        container.innerHTML = `<div class="mermaid">${code}</div>`;
        mermaid.run();
    }
</script>
</body>
</html>
